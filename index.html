<style>
/* Layout: one reading column of pattern cards, grouped by situation; a study-mode switch turns the column into a single flashcard drill. */
:root{
  --paper:#F4F6F3; --card:#FFFFFF; --ink:#1B2630; --muted:#5B686C; --line:#D9E0DC;
  --accent:#1E6B59; --accent-ink:#FFFFFF; --soft:#E6EFEB; --marker:rgba(240,210,80,.55); --ok:#2E7D4F; --miss:#B2552E;
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-en:"Literata",Georgia,serif;
  --f-pat:"Hiragino Sans","Hiragino Kaku Gothic ProN","ヒラギノ角ゴシック","Zen Kaku Gothic New",sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11181B; --card:#182124; --ink:#E6ECEA; --muted:#98A6A4; --line:#2A3639;
  --accent:#6FC3A8; --accent-ink:#0E1A16; --soft:#1F2C2B; --marker:rgba(212,180,60,.38); --ok:#74C995; --miss:#E39470; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181B; --card:#182124; --ink:#E6ECEA; --muted:#98A6A4; --line:#2A3639;
  --accent:#6FC3A8; --accent-ink:#0E1A16; --soft:#1F2C2B; --marker:rgba(212,180,60,.38); --ok:#74C995; --miss:#E39470; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-jp);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding-inline:18px;padding-block:28px 80px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;gap:14px;padding-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}
h1{word-break:auto-phrase;font-family:var(--f-jp);font-weight:700;font-size:clamp(26px,6vw,36px);line-height:1.3;margin:0;text-wrap:balance}
h1 .num{font-family:var(--f-display);font-weight:400;font-size:1.5em;color:var(--accent);margin-left:.1em;line-height:1}
.lead{margin:0;color:var(--muted);max-width:60ch}

.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.speed{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.speed .seg button{padding:4px 11px;font-size:13px}
.order-seg button{padding:5px 14px;font-size:13px}
.seg .badge{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;line-height:1.6;text-align:center;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"] .badge{background:var(--accent-ink);color:var(--accent)}
.seg .badge:empty{display:none}
.miss-tag{color:var(--miss);font-weight:700}
.empty-actions{display:flex;gap:10px;flex-wrap:wrap}
.linkbtn{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--ink);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
.chips a:hover{border-color:var(--accent)}

section.cat{padding-top:34px}
.cat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cat-head h2{margin:0;font-size:20px;font-weight:700}
.cat-head .en{font-family:var(--f-display);font-style:italic;font-size:20px;color:var(--muted)}
.cat-head .count{margin-left:auto;font-size:12px;color:var(--muted)}
.list{display:grid;gap:16px;container-type:inline-size}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.pic{margin:0;background:var(--soft)}
.pic img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.body{padding:18px 20px 18px;display:grid;gap:14px;min-width:0}
.head,.rest{display:grid;gap:14px;min-width:0;align-content:start}
@container (min-width: 620px){
  .card{grid-template-columns:minmax(0,44%) minmax(0,1fr);grid-template-areas:"pic head" "rest rest"}
  .body{display:contents}
  .pic{grid-area:pic;padding:20px 0 0 20px;background:transparent}
  .pic img{border-radius:10px}
  .head{grid-area:head;padding:20px 20px 0}
  .rest{grid-area:rest;padding:6px 20px 20px}
}
.card-top{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.no{font-family:var(--f-display);font-size:22px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.pat{font-family:var(--f-pat);font-size:24px;line-height:1.3;margin:0;font-weight:600;letter-spacing:.01em;min-width:0;overflow-wrap:anywhere}
.mean{grid-column:2;font-weight:500;font-size:15px}
.label{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}

.line{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:start}
.line .txt{min-width:0}
.en{font-family:var(--f-en);font-size:17px;line-height:1.55}
.ja{font-size:13.5px;color:var(--muted)}
mark{background:linear-gradient(transparent 52%,var(--marker) 52%);color:inherit;padding:0 1px}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--accent);background:transparent;display:grid;place-items:center;color:var(--accent);flex:none;margin-top:1px}
.play svg{width:14px;height:14px;fill:currentColor;margin-left:2px}
.play.on{background:var(--accent);color:var(--accent-ink)}

.example{display:grid;gap:8px}
.scene{background:var(--soft);border-radius:10px;padding:14px 14px 12px;display:grid;gap:10px}
.scene-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scene-head .where{font-weight:700;font-size:14px}
.both{margin-left:auto;border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:700;padding:2px 0}
.talk{display:grid;gap:10px}
.who{font-family:var(--f-display);font-size:18px;width:20px;color:var(--muted);text-align:center;line-height:36px}
.talk .line{grid-template-columns:20px auto 1fr}
.talk .en{font-size:16px}
.note{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:2px}

/* drill */
.drill{padding-top:22px;display:grid;gap:16px}
.drill-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.drill-bar select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:14px}
.tally{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ok)}
.flash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;display:grid;gap:18px;min-height:340px}
.flash-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt-ja{word-break:auto-phrase;font-size:clamp(20px,5vw,25px);font-weight:700;line-height:1.55;margin:0;text-wrap:balance}
.where-sm{font-size:13px;color:var(--muted)}
.hints{display:flex;flex-wrap:wrap;gap:8px}
.hbtn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.hbtn[disabled]{opacity:.45;cursor:default}
.hbtn.main{background:var(--accent);color:var(--accent-ink)}
.hintbox{display:grid;gap:8px}
.hint{background:var(--soft);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.hint .k{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.hint .v{font-family:var(--f-en);font-size:16px}
.hint .v.pat2{font-family:var(--f-pat);font-size:18px;font-weight:600}
.answer{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.answer .en{font-size:19px}
.judge{display:flex;gap:10px;flex-wrap:wrap}
.judge button{flex:1 1 140px;border-radius:10px;padding:10px 14px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.judge .yes{border-color:var(--ok);color:var(--ok)}
.nav{display:flex;justify-content:space-between;gap:10px}
.done{font-size:13px;color:var(--ok);font-weight:700}
footer{margin-top:48px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.hint,.answer{animation:in .18s ease-out}}
@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (max-width:440px){.mode-seg{display:grid;grid-template-columns:1fr 1fr;width:100%;border-radius:14px;gap:2px}.mode-seg button{border-radius:10px;padding:7px 8px;white-space:nowrap}.mode-seg button:last-child{grid-column:1 / -1}.controls{gap:8px}.body{padding:16px}.pat{font-size:21px}.flash{padding:20px 16px}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">たかしとれいちゃんの英語日和　音声つき練習帳</div>
    <h1>日常英会話で必ず使う型<span class="num">39</span></h1>
    <p class="lead">例文と、その型を使う場面の会話を音声で聞けます。「瞬間英作文」に切り替えると、日本語を見て英語を言う練習ができます。</p>
  </header>

  <div class="controls">
    <div class="seg mode-seg" role="group" aria-label="モード">
      <button id="m-learn" aria-pressed="true">話す・聞く</button>
      <button id="m-drill" aria-pressed="false">瞬間英作文</button>
      <button id="m-review" aria-pressed="false">分からなかった問題の復習<span class="badge" id="miss-count"></span></button>
    </div>
    <div class="speed"><span>音声</span>
      <div class="seg" role="group" aria-label="再生速度">
        <button id="sp-1" aria-pressed="true">ふつう</button>
        <button id="sp-2" aria-pressed="false">ゆっくり</button>
      </div>
    </div>
  </div>

  <main id="learn"></main>
  <main id="drill" class="drill" hidden></main>

  <footer>音声はAIで生成した米国英語の読み上げです。</footer>
</div>

<script>
const DATA = {"cats": [{"id": "c1", "name": "気持ちを伝える", "en": "Feelings"}, {"id": "c2", "name": "お願い・提案する", "en": "Requests"}, {"id": "c3", "name": "人を動かす", "en": "Getting people to act"}, {"id": "c4", "name": "経験・過去をふり返る", "en": "Past & experience"}, {"id": "c5", "name": "今・これから", "en": "Now & next"}, {"id": "c6", "name": "推測する・ぼかす", "en": "Guessing"}, {"id": "c7", "name": "状況を説明する", "en": "Describing"}], "items": [{"cat": "c1", "pat": "feel like ～ing", "mean": "〜したい気分だ", "ex": "I feel like having ramen tonight.", "exJa": "今夜はラーメンが食べたい気分です。", "hl": ["feel like having"], "note": "eatingなら「より食べる行為に注目」され havingなら「食べに行く行為、食べるシーンや経験に注目」されます。日常会話ではhavingが多く使われます。", "scene": "金曜の夜、同僚との帰り道", "a": "Any plans for dinner?", "aJa": "夕飯、何か予定ある？", "b": "I feel like having ramen tonight.", "bJa": "今夜はラーメンの気分なんだよね。", "words": ["ramen", "tonight", "have"]}, {"cat": "c1", "pat": "can't wait to ～", "mean": "〜するのが待ちきれない", "ex": "I can't wait to see my grandchildren.", "exJa": "孫に会うのが待ちきれません。", "hl": ["can't wait to see"], "note": "I’m looking forward to seeingはよりフォーマルで can’t wait to seeはよりカジュアルな文脈で使われます。 look forward toの後ろはingでcan’t wait toの後ろは動詞の原形という点に注意です。", "scene": "連休前、友人との会話", "a": "Are you going back home for the holidays?", "aJa": "連休は帰省するの？", "b": "Yes! I can't wait to see my grandchildren.", "bJa": "うん！孫に会うのが待ちきれないよ。", "words": ["see", "grandchildren"]}, {"cat": "c1", "pat": "worth ～ing", "mean": "〜する価値がある", "ex": "This movie is worth watching.", "exJa": "この映画は見る価値があります。", "hl": ["worth watching"], "note": "", "scene": "友人に映画をすすめる", "a": "Is that new movie any good?", "aJa": "あの新しい映画って面白い？", "b": "Yes! It's definitely worth watching.", "bJa": "うん！絶対に見る価値あるよ。", "words": ["movie", "watch"]}, {"cat": "c1", "pat": "It is 感情 that ～", "mean": "〜とは（感情）だ", "ex": "It is surprising that he speaks four languages.", "exJa": "彼が4ヶ国語話せるとは驚きです。", "hl": ["It is surprising that"], "note": "", "scene": "新しい同僚のうわさ話", "a": "Did you know Ken speaks English, Chinese, Spanish, and Korean?", "aJa": "ケンって英語、中国語、スペイン語、韓国語を話せるって知ってた？", "b": "Really? It's surprising that he speaks four languages.", "bJa": "本当？4ヶ国語も話せるなんて驚き。", "words": ["surprising", "speak", "four languages"]}, {"cat": "c1", "pat": "It's not that ～ , but ～", "mean": "〜というわけではなく、〜", "ex": "It's not that I don't like coffee, but I prefer tea.", "exJa": "コーヒーが嫌いなわけではなく、紅茶のほうが好きです。", "hl": ["It's not that", ", but"], "note": "行きたくないわけではない、起こってるわけじゃない、など 汎用性高く使える型になっています。", "scene": "カフェで注文するとき", "a": "Tea? You don't like coffee?", "aJa": "紅茶？コーヒーは苦手なの？", "b": "It's not that I don't like coffee, but I prefer tea.", "bJa": "コーヒーが嫌いってわけじゃないけど、紅茶のほうが好きなんだ。", "words": ["like", "coffee", "prefer", "tea"]}, {"cat": "c1", "pat": "It is 形容詞 to do", "mean": "〜するのは〜だ", "ex": "It is important to exercise regularly.", "exJa": "定期的に運動することは大切です。", "hl": ["It is important to"], "note": "", "scene": "健康診断のあとの会話", "a": "My doctor told me to walk more.", "aJa": "医者にもっと歩くように言われたよ。", "b": "Yeah, it's important to exercise regularly.", "bJa": "うん、定期的に運動するのは大事だよね。", "words": ["important", "exercise", "regularly"]}, {"cat": "c2", "pat": "would", "mean": "（控えめな気持ちや感謝を表す）〜だ、〜だろう", "ex": "If we could meet at 3 p.m., that would be great.", "exJa": "もし午後3時に会えたら、とても助かるよ。", "hl": ["could", "would"], "note": "wouldは「ぼんやりしたイメージ」を持つ単語で、遠回しな表現や控えめな感謝の気持ち、 丁寧な響きを出すことができます。便利なので押さえておきましょう！ couldも似ており、ここでは遠回しに「〜できたら」という表現になっています。", "scene": "友人と待ち合わせ時間を決める", "a": "What time works for you tomorrow?", "aJa": "明日は何時なら都合いい？", "b": "If we could meet at 3 p.m., that would be great.", "bJa": "午後3時に会えたら、すごく助かるな。", "words": ["if we could", "meet", "3 p.m.", "great"]}, {"cat": "c2", "pat": "How about ～ing", "mean": "〜してみませんか？（提案）", "ex": "How about taking a walk after dinner?", "exJa": "夕食後に散歩しませんか？", "hl": ["How about taking"], "note": "", "scene": "家族との夕食どき", "a": "I ate too much tonight.", "aJa": "今日は食べすぎちゃった。", "b": "How about taking a walk after dinner?", "bJa": "じゃあ、夕食のあとに散歩しない？", "words": ["take a walk", "after dinner"]}, {"cat": "c2", "pat": "want 人 to do", "mean": "人に〜してほしい", "ex": "I want you to call me when you arrive.", "exJa": "到着したら電話してほしいです。", "hl": ["want you to call"], "note": "want to、〜したいの変化型です！wantとtoの間に人を挟む形でよく使われます。", "scene": "旅行に出る家族を見送る", "a": "OK, I'm leaving now.", "aJa": "じゃあ、もう行くね。", "b": "I want you to call me when you arrive.", "bJa": "着いたら電話してね。", "words": ["you", "call", "arrive", "when"]}, {"cat": "c2", "pat": "ask 人 to do", "mean": "人に〜するよう頼む", "ex": "I asked my daughter to clean the living room.", "exJa": "娘にリビングの掃除をするよう頼みました。", "hl": ["asked my daughter to clean"], "note": "", "scene": "来客に家をほめられて", "a": "Your house looks so clean!", "aJa": "家、すごくきれいだね！", "b": "Thanks. I asked my daughter to clean the living room.", "bJa": "ありがとう。娘にリビングの掃除を頼んだの。", "words": ["daughter", "clean", "living room"]}, {"cat": "c2", "pat": "what if ～", "mean": "もし〜ならどうする？", "ex": "What if you miss the last train?", "exJa": "もし終電を逃したらどうしますか？", "hl": ["What if"], "note": "What ifは主にネガティブなことが起きるときに使われます。", "scene": "飲み会で遅くまで残る同僚に", "a": "I think I'll stay a little longer.", "aJa": "もう少しいようかな。", "b": "What if you miss the last train?", "bJa": "終電逃したらどうするの？", "words": ["miss", "the last train"]}, {"cat": "c3", "pat": "make A do", "mean": "Aに〜させる（強制力が強い）", "ex": "The movie made me cry.", "exJa": "その映画で泣いてしまいました。＝その映画は私を泣かせた", "hl": ["made me cry"], "note": "〜させるには、make, get, let,,haveなどがありますが、微妙な違いがあります。 makeは強制力が非常に強く、getはやや説得しての意味を持ち、haveは業務指示的、 letは相手の自由意志を尊重するといった違いがあります。", "scene": "週末に見た映画の感想", "a": "How was the movie last night?", "aJa": "昨日の映画、どうだった？", "b": "It was so moving. The movie made me cry.", "bJa": "すごく感動した。泣いちゃったよ。", "words": ["movie", "cry", "made"]}, {"cat": "c3", "pat": "let A do", "mean": "Aに〜させる（許可する、自由意志の尊重）", "ex": "I let my son use my phone.", "exJa": "息子にスマホを使わせた。", "hl": ["let my son use"], "note": "makeのように無理やりではなく、相手の意思の尊重になります。", "scene": "電車で子どもが静かだった理由", "a": "Your son was so quiet on the train.", "aJa": "息子さん、電車でずっと静かだったね。", "b": "I let him use my phone.", "bJa": "スマホを ant to go this summer?", "aJa": "この夏はどこに行きたい？", "b": "Europe! I've never been to Europe before.", "bJa": "ヨーロッパ！一度も行ったことないんだ。", "words": ["been", "Europe"]}, {"cat": "c4", "pat": "should have + 過去分詞", "mean": "〜すべきだった", "ex": "I should have brought my umbrella.", "exJa": "傘を持ってくるべきでした。", "hl": ["should have brought"], "note": "", "scene": "急な雨に降られて", "a": "Oh no, it's raining!", "aJa": "うわ、雨降ってきた！", "b": "I should have brought my umbrella.", "bJa": "傘持ってくればよかった。", "words": ["brought", "umbrella"]}, {"cat": "c4", "pat": "It's been ～ since ～", "mean": "〜してから〜が経つ", "ex": "It's been a long time since I saw you last.", "exJa": "最後に会ってからだいぶ経ちますね。", "hl": ["It's been", "since"], "note": "sinceの後ろは必ず「過去形」になるので注意しましょう。", "scene": "同窓会で旧友に再会", "a": "Hi! Do you remember me?", "aJa": "久しぶり！覚えてる？", "b": "Of course! It's been a long time since I saw you last.", "bJa": "もちろん！最後に会ってからずいぶん経つね。", "words": ["a long time", "saw", "last"]}, {"cat": "c4", "pat": "so far", "mean": "これまでのところ", "ex": "So far, everything is going well.", "exJa": "今のところ、すべて順調です。", "hl": ["So far"], "note": "", "scene": "新しい職場について聞かれて", "a": "How's your new job?", "aJa": "新しい仕事はどう？", "b": "So far, everything is going well.", "bJa": "今のところ、全部順調だよ。", "words": ["everything", "go well"]}, {"cat": "c5", "pat": "It's getting + 形容詞", "mean": "だんだん〜になってきた", "ex": "It's getting cold these days.", "exJa": "最近寒くなってきました。", "hl": ["It's getting cold"], "note": "", "scene": "朝、近所の人とあいさつ", "a": "Good morning!", "aJa": "おはようございます！", "b": "Good morning. It's getting cold these days.", "bJa": "おはようございます。最近寒くなってきましたね。", "words": ["cold", "these days"]}, {"cat": "c5", "pat": "keep ～ing", "mean": "ずっと〜し続ける", "ex": "She keeps calling me.", "exJa": "彼女は私にずっと電話してきます。", "hl": ["keeps calling"], "note": "", "scene": "鳴りやまないスマホ", "a": "Your phone is ringing again.", "aJa": "また電話鳴ってるよ。", "b": "I know. She keeps calling me.", "bJa": "わかってる。彼女がずっとかけてくるんだ。", "words": ["she", "call", "me"]}, {"cat": "c5", "pat": "be about to", "mean": "まさに〜し ut it could be okay if we hurry.", "exJa": "時間はないけど、急いだら間に合うかもしれません", "hl": ["could be okay"], "note": "丁寧なお願いのCould you～?などもありますが、 こういった可能性を示すcouldも日常会話でかなり使われます。", "scene": "駅へ急ぎながら", "a": "Can we still make the 10:15 train?", "aJa": "10時15分の電車、まだ間に合うかな？", "b": "We don’t have much time, but it could be okay if we hurry.", "bJa": "あまり時間はないけど、急げば間に合うかも。", "words": ["much time", "okay", "hurry"]}, {"cat": "c6", "pat": "It seems that ～", "mean": "〜のようだ", "ex": "It seems that everyone enjoyed the party.", "exJa": "みんなパーティーを楽しんだようです。", "hl": ["It seems that"], "note": "thatの後ろは主語＋動詞（SV）で文が続きます。", "scene": "パーティーの片付け中", "a": "Thanks for organizing tonight.", "aJa": "今日は幹事ありがとう。", "b": "My pleasure. It seems that everyone enjoyed the party.", "bJa": "どういたしまして。みんな楽しんでくれたみたいだね。", "words": ["everyone", "enjoyed", "party"]}, {"cat": "c6", "pat": "I'm not sure if ～", "mean": "〜かどうかわからない", "ex": "I'm not sure if it will rain tomorrow.", "exJa": "明日雨が降るかどうかわかりません。", "hl": ["I'm not sure if"], "note": "「もし〜なら」という意味では、if節の中は現在形になりますが、 「〜かどうか」という意味では、if節の中でもwillが使えます。", "scene": "週末のバーベキューの相談", "a": "Should we have the barbecue tomorrow?", "aJa": "明日バーベキューする？", "b": "Hmm, I'm not sure if it will rain tomorrow.", "bJa": "うーん、明日雨が降るかどうかわからないんだよね。", "words": ["rain", "will", "tomorrow"]}, {"cat": "c6", "pat": "what S V", "mean": "SがVすること（もの）", "ex": "I don’t know what she wants.", "exJa": "彼女が欲しいものが分からない。", "hl": ["what she wants"], "note": "語順として非常にわかりにくいですが、日常会話で必ず使うので押さえておきましょう！ I don’t understand what he said.「彼の言ったこと」が理解できない。 What I love is music.「私が大好きなもの」は音楽です。のように使えます。", "scene": "妻への誕生日プレゼントに悩む", "a": "What are you getting your wife for her birthday?", "aJa": "奥さんの誕生日、何をあげるの？", "b": "I have no idea. I don’t know what she wants.", "bJa": "全然わからない。何が欲しいのかわからないんだ。", "words": ["know", "she", "want"]}, {"cat": "c7", "pat": "hear + ing", "mean": "〜しているのを聞く", "ex": "I heard someone singing in the kitchen.", "exJa": "誰かがキッチンで歌っているのが聞こえました。", "hl": ["heard someone singing"], "note": " const norm = s => s.replace(/’/g,"'");

/* ---------- audio ---------- */
const player = new Audio();
let rate = 1, queue = [], activeBtn = null;
function clearActive(){ if(activeBtn){activeBtn.classList.remove('on');} activeBtn=null; }
function playKeys(keys, btns){
  player.pause(); clearActive();
  queue = keys.map((k,i)=>({k, b:btns[i]}));
  next();
}
function next(){
  clearActive();
  const q = queue.shift(); if(!q) return;
  player.src = (rate===1 ? AUDIO : AUDIO_SLOW)[q.k];
  activeBtn = q.b || null; if(activeBtn) activeBtn.classList.add('on');
  player.play().catch(()=>clearActive());
}
player.addEventListener('ended', ()=>{ setTimeout(next, queue.length?350:0); });

/* ---------- helpers ---------- */
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function marked(text, hl){
  let out='', pos=0;
  for(const h of hl){
    const i = norm(text).indexOf(norm(h), pos);
    if(i<0) continue;
    out += esc(text.slice(pos,i)) + '<mark>' + esc(text.slice(i,i+h.length)) + '</mark>';
    pos = i+h.length;
  }
  return out + esc(text.slice(pos));
}
const playBtn = (key,label) => `<button class="play" data-k="${key}" aria-label="${label}">${PLAY}</button>`;

function renderLearn(){

  let html = '<nav class="chips" aria-label="カテゴリ">' + DATA.cats.map(c=>`<a href="#${c.id}">${c.name}</a>`).join('') + '</nav>';
  for(const c of DATA.cats){
    const items = DATA.items.filter(it=>it.cat===c.id);
    html += `<section class="cat" id="${c.id}"><div class="cat-head"><h2>${c.name}</h2><span class="en">${c.en}</span><span class="count">${items.length}個</span></div><div class="list">`;
    for(const it of items){
      const bMarked = norm(it.b).includes(norm(it.hl[0])) ? marked(it.b, it.hl) : esc(it.b);
      html += `<article class="card">
        <figure class="pic"><img src="${it.n}.webp" alt="${esc(it.scene)}の場面のイラスト" width="960" height="640" loading="lazy" decoding="async"></figure>
        <div class="body"><div class="head">

const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
let got = new Set(store.get('eikaiwa39-got', []));
/* miss: Map of item number -> times answered "もう一度" since last success */
let miss = new Map(store.get('eikaiwa39-miss', []));
const saveAll = ()=>{ store.set('eikaiwa39-got',[...got]); store.set('eikaiwa39-miss',[...miss]); updateBadge(); };
function updateBadge(){ document.getElementById('miss-count').textContent = miss.size ? miss.size : ''; }

let mode = 'learn', confirming = false;
const S = {
  drill:  {deck:[], idx:0, step:0, filter:'all', shuffled:false},
  review: {deck:[], idx:0, step:0, shuffled:false}
};
const byNo = n => DATA.items.find(it=>it.n===n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildDeck(m){
  const st = S[m];
  if(m==='drill'){
    const f = st.filter;
    st.deck = DATA.items.filter(it => f==='all' || (f==='todo' ? !got.has(it.n) : it.cat===f));
  } else {
    st.deck = [...miss.keys()].map(byNo).filter(Boolean);
  }
  if(st.shuffled) shuffle(st.deck);
  st.idx = 0; st.step = 0;
}

function cardHtml(it, st, m){
  const hints = [];
  if(st.step>=1) hints.push(`<div class="hint"><span class="k">ヒント1　型</span><span class="v pat2">${esc(it.pat)}</span><span class="ja">${esc(it.mean)}</span></div>`);
  if(st.step>=2) hints.push(`<div class="hint"><span class="k">ヒント2　使う単語</span><span class="v">${it.words.map(esc).join('　/　')}</span></div>`);
  const status = miss.has(it.n) ? `　<span class="miss-tag">分からなかった回数 ${miss.get(it.n)}回</span>` : (got.has(it.n) ? '　<span class="done">言えた</span>' : '');
  return `<div class="flash">
    <div class="flash-meta"><span>${st.idx+1} / ${st.deck.length}</span><span>No.${it.n}　${DATA.cats.find(c=>c.id===it.cat).name}${status}</span></div>
    <div><div class="where-sm">場面：${esc(it.scene)}</div><p class="prompt-ja">${esc(it.exJa)}</p></div>
    <div class="hints">
      <button class="hbtn" data-step="1" ${st.step>=1?'disabled':''}>ヒント1：型</button>
      <button class="hbtn" data-step="2" ${st.step>=2?'disabled':''}>ヒント2：使う単語</button>
      <button class="hbtn main" data-step="3" ${st.step>=3?'disabled':''}>答えを見る</button>
    </div>
    ${hints.length?`<div class="hintbox">${hints.join('')}</div>`:''}
    ${st.step>=3?`<div class="answer"><div class="label">答え</div>
      <div class="line">${playBtn(it.n+'-ex','答えを再生')}<div class="txt"><div class="en">${marked(it.ex,it.hl)}</div></div></div>
      ${m==='review'
        ? `<div class="judge"><button class="yes" data-judge="mastered">もう覚えた ✓</button><button data-judge="0">まだ → 次へ</button></div>`
        : `<div class="judge"><button class="yes" data-judge="1">言えた → 次へ</button><button data-judge="0">分からなかった → 次へ</button></div>`}</div>`:''}
    ${m==='review' && st.step<3 ? `<div><button class="linkbtn" data-judge="mastered">答えを見ずに「もう覚えた」にする</button></div>` : ''}
  </div>`;
}

    const opts = `<option value="all">すべての型（39）</option><option value="todo">まだ「言えた」になっていない型</option>` +

    bar = `<div class="drill-bar">

      <span class="tally">言えた <b>${got.size}</b> / 39</span>
    </div>`;
    body = it ? cardHtml(it, st, mode)
      : `<div class="flash"><p class="prompt-ja">この範囲の型はすべて「言えた」になりました。</p><p class="where-sm">ほかのカテゴリを選ぶか、「すべての型」でもう一周してみましょう。</p></div>`;
  } else {
    bar = `<div class="drill-bar">
      <span class="where-sm">瞬間英作文で「分からなかった」を押した問題がここに集まります。「もう覚えた」を押すとリストから外れます。</span>
    </div>
    ${miss.size ? `<div class="drill-bar">
      <div class="seg order-seg" role="group" aria-label="出題順"><button data-order="seq" aria-pressed="${!st.shuffled}">順番通り</button><button data-order="shuf" aria-pressed="${st.shuffled}">シャッフル</button></div>
      <span class="tally">復習リスト <b style="color:var(--miss)">${miss.size}</b> 問</span>
    </div>` : ''}`;
    body = it ? cardHtml(it, st, mode)
      : `<div class="flash"><p class="prompt-ja">${miss.size===0 && got.size ? '復習リストはすべてクリアしました。' : 'まだ分からなかった問題はありません。'}</p>
          <p class="where-sm">瞬間英作文で答えを見て「分からなかった」を押すと、その問題がここに記録されます。</p>
          <div class="empty-actions"><button class="hbtn main" id="go-drill">瞬間英作文へ</button></div></div>`;
  }
  const foot = it ? `<div class="nav"><button class="ghost" id="d-prev" ${st.idx===0?'disabled':''}>← 前へ</button><button class="ghost" id="d-next">次へ →</button></div>` : '';
  const reset = (mode==='review' && miss.size) ? (confirming
      ? `<div class="confirm">復習リストを空にしますか？<button class="ghost" id="d-reset-yes">空にする</button><button class="ghost" id="d-reset-no">やめる</button></div>`
      : `<div><button class="linkbtn" id="d-reset">復習リストを空にする</button></div>`) : '';
  el.innerHTML = bar + body + foot + reset;
  const f = document.getElementById('d-filter'); if(f) f.value = S.drill.filter;
}

document.getElementById('drill').addEventListener('change', e=>{
  if(e.target.id==='d-filter'){ S.drill.filter = e.target.value; buildDeck('drill'); renderDrill(); }
});
document.getElementById('drill').addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  const st = S[mode];
  if(t.id==='go-drill'){ setMode('drill'); return; }
  if(t.id==='d-reset'){ confirming = true; renderDrill(); return; }
  if(t.id==='d-reset-no'){ confirming = false; renderDrill(); return; }
  if(t.id==='d-reset-yes'){ confirming = false; miss.clear(); saveAll(); buildDeck('review'); renderDrill(); return; }
  if(t.dataset.order){ st.shuffled = t.dataset.order==='shuf'; buildDeck(mode); renderDrill(); return; }
  if(t.id==='d-prev'){ st.idx=Math.max(0,st.idx-1); st.step=0; renderDrill(); return; }
  if(t.id==='d-next'){ st.idx=(st.idx+1)%st.deck.length; st.step=0; renderDrill(); return; }
  if(t.classList.contains('play')){ playKeys([t.dataset.k],[t]); return; }
  if(t.dataset.step){ st.step = Math.max(st.step, +t.dataset.step); renderDrill(); return; }
  if(t.dataset.judge!==undefined){
    const it = st.deck[st.idx], j = t.dataset.judge;
    const mastered = j==='mastered';
    if(mastered){ got.add(it.n); miss.delete(it.n); }
    else if(j==='1'){ got.add(it.n); }
    else { got.delete(it.n); miss.set(it.n, (miss.get(it.n)||0)+1); }
    saveAll();
    if(mastered){
      st.deck.splice(st.idx,1);
      if(st.idx>=st.deck.length) st.idx=0;
      st.step=0;
    } else if(mode==='drill' && S.drill.filter==='todo'){
      buildDeck('drill');
    } else {
      st.idx=(st.idx+1)%st.deck.length; st.step=0;
    }
    renderDrill();
  }
});

/* ---------- mode & speed ---------- */
function setMode(m){
  mode = m; confirming = false;
  for(const k of ['learn','drill','review']) document.getElementById('m-'+k).setAttribute('aria-pressed', m===k);
  document.getElementById('learn').hidden = m!=='learn';
  document.getElementById('drill').hidden = m==='learn';
  player.pause(); queue=[]; clearActive();
  if(m==='review') buildDeck('review');
  if(m!=='learn') renderDrill();
  store.set('eikaiwa39-mode', m);
}
document.getElementById('m-learn').onclick = ()=>setMode('learn');
document.getElementById('m-drill').onclick = ()=>setMode('drill');
document.getElementById('m-review').onclick = ()=>setMode('review');
function setRate(r){
  rate = r;
  document.getElementById('sp-1').setAttribute('aria-pressed', r===1);
  document.getElementById('sp-2').setAttribute('aria-pressed', r!==1);
}
document.getElementById('sp-1').onclick = ()=>setRate(1);
document.getElementById('sp-2').onclick = ()=>setRate(0.75);

renderLearn(); buildDeck('drill'); updateBadge();
{
  const h = location.hash.replace('#','');
  const start = (h==='drill'||h==='review') ? h : store.get('eikaiwa39-mode','learn');
  if(start==='drill'||start==='review') setMode(start);
}
</script>
